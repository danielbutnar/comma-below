<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comma Below cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  /* Same palette and fonts as post/cover.html; both words in ink, nothing labelled: the post answers the question. */
  :root { --paper: #f3eee4; --ink: #1c1a17; --muted: #6b645a; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1000px; height: 420px; background: var(--paper); color: var(--ink);
         font-family: "Source Serif 4", Georgia, serif; overflow: hidden; }
  .frame { position: relative; width: 100%; height: 100%; padding: 34px 48px; }
  .kicker { font: 500 14px/1 "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .words { position: absolute; left: 48px; right: 48px; top: 96px; display: flex; align-items: baseline; justify-content: space-between; }
  .word { font-weight: 600; font-size: 132px; line-height: 1; letter-spacing: -0.01em; }
  .or { font-style: italic; font-size: 44px; color: var(--muted); }
  .ask { position: absolute; left: 48px; right: 48px; top: 268px; text-align: center;
         font: 500 21px/1.3 "IBM Plex Mono", monospace; color: var(--ink); }
  .foot { position: absolute; left: 48px; right: 48px; bottom: 30px; display: flex; justify-content: space-between;
          font: 400 15px/1 "IBM Plex Mono", monospace; color: var(--muted); }
  .foot b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="frame">
  <div class="kicker">Romanian comma below · a Kaggle benchmark</div>
  <div class="words">
    <div class="word">Bra&#x15F;ov</div>
    <div class="or">or</div>
    <div class="word">Bra&#x219;ov</div>
  </div>
  <div class="ask">One of them is my city. Which one?</div>
  <div class="foot"><span><b id="models">43 models</b> · <b>13 tasks</b> · <b>0 LLM judges</b></span><span>scored by code point</span></div>
</div>
</body>
</html>
